name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

jobs:
  typecheck:
    name: Typecheck
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (node + web)
        run: npm run typecheck
      # Release gate: every advertised download link and docs version string must
      # match package.json. A version left behind in RELEASE.md / docs turns the
      # download buttons into 404s the moment the next release ships — this catches
      # it on the release branch, before a tag, instead of on launch day.
      - name: Release links consistent
        run: npm run check:links

  test:
    name: Test
    runs-on: macos-latest
    # Requires MD-02 (adds --test-timeout, fixes proc-kill.test.cjs and
    # hive-hook-node.test.cjs never closing their handles) — without it this
    # job hangs on every PR until the timeout below kills it. Suite runs in
    # ~24.5s once MD-02 lands.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm run test:focused

  build:
    name: Build
    runs-on: macos-latest
    # Build exercises the native node-pty rebuild. A broken build should block
    # merges like any other gate; if the native toolchain proves flaky on
    # macos-latest, fix that with caching/pinning — don't silence failures here.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
