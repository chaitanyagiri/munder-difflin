<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Precinct</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.openai.com https://*.openai.com wss://api.openai.com wss://*.openai.com; media-src 'self' blob: mediastream:;" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- v0.3.4 type revamp: Press Start 2P stays as the BRAND display face
         (small caps labels only); body/UI moves to Inter and code/terminal to
         JetBrains Mono — the pixel body fonts (Pixelify/VT323) read as toy-like
         and strained at data-dense sizes. -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      #cth-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: #E8EDF1; color: #14283D;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      #cth-splash .mk {
        display: grid; place-items: center;
        width: 48px; height: 58px; background: #14283D; color: #D8A72E;
        clip-path: polygon(50% 0, 92% 13%, 92% 53%, 78% 76%, 50% 100%, 22% 76%, 8% 53%, 8% 13%);
        font-family: "Press Start 2P", monospace; font-size: 12px; letter-spacing: -1px;
        box-shadow: none;
      }
      #cth-splash .title { font-family: "Press Start 2P", monospace; font-size: 13px; }
      #cth-splash .hint { font-size: 15px; color: #516579; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="cth-splash">
        <div class="mk">TP</div>
        <div class="title">THE PRECINCT</div>
        <div class="hint">opening the precinct…</div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
